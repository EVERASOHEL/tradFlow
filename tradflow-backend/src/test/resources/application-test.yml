spring:
  datasource:
    url: jdbc:h2:mem:tradeflow_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
  jwt:
    secret: "CHANGE_ME_TO_A_LONG_RANDOM_BASE64_SECRET_MIN_256_BITS_1234567890"
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 604800000
    issuer: accounting-backend
